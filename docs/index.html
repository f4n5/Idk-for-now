<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VEX // CRACKER OMEGA</title>
<style>
  :root { --bg:#050508; --panel:#0d0d12; --border:#1f1f2a; --txt:#d1d1d6; --acc:#00ffcc; --warn:#ffaa00; --err:#ff3366; }
  * { box-sizing:border-box; }
  body { background:var(--bg); color:var(--txt); font:14px/1.5 ui-monospace,monospace; padding:16px; margin:0; overflow-x:hidden; }
  @keyframes pulse { 0%{opacity:1;}50%{opacity:0.5;}100%{opacity:1;} }
  h1 { font-size:18px; color:var(--acc); margin:0 0 16px 0; text-transform:uppercase; letter-spacing:2px; display:flex; align-items:center; gap:10px; }
  h1::before { content:''; width:10px; height:10px; background:var(--acc); border-radius:50%; animation:pulse 2s infinite; }
  #drop { border:2px dashed var(--border); border-radius:12px; padding:40px 20px; text-align:center; color:#888; margin-bottom:16px; cursor:pointer; background:var(--panel); transition:all .2s; }
  #drop.hot { border-color:var(--acc); color:var(--acc); background:rgba(0,255,204,0.05); }
  #status { color:var(--acc); margin-bottom:12px; font-weight:bold; }
  #status.err { color:var(--err); }
  #out { background:#000; border:1px solid var(--border); border-radius:8px; padding:16px; white-space:pre-wrap; word-break:break-all; max-height:65vh; overflow-y:auto; font-size:13px; display:none; }
  .hit { color:var(--warn); font-weight:bold; display:block; margin:6px 0; padding:10px; background:rgba(255,170,0,0.06); border-left:3px solid var(--warn); border-radius:4px; }
  .str { color:#555; display:block; padding:1px 0; }
  input[type=file]{ display:none; }
</style>
</head>
<body>

<h1>VEX // CRACKER OMEGA</h1>
<div id="drop"><b>TAP HERE</b> to load target</div>
<input type="file" id="fileInput" accept=".txt,.lua">
<div id="status">waiting...</div>
<div id="out"></div>

<script>
const drop=document.getElementById('drop'),fi=document.getElementById('fileInput'),
      st=document.getElementById('status'),out=document.getElementById('out');

drop.onclick=()=>fi.click();
drop.addEventListener('dragover',e=>{e.preventDefault();drop.classList.add('hot')});
drop.addEventListener('dragleave',()=>drop.classList.remove('hot'));
drop.addEventListener('drop',e=>{e.preventDefault();drop.classList.remove('hot');if(e.dataTransfer.files.length)load(e.dataTransfer.files[0]);});
fi.onchange=e=>{if(e.target.files.length)load(e.target.files[0]);};

function log(msg,isErr){
  st.textContent=msg;
  st.className = isErr ? 'err' : '';
}

function load(file){
  log(`reading ${file.name}...`); out.style.display='none'; out.innerHTML='';
  const r=new FileReader();
  r.onload=e=>setTimeout(()=>process(e.target.result),50);
  r.readAsText(file);
}

function decEsc(lit){
  const o=[];let i=0;
  while(i<lit.length){
    if(lit[i]==='\\'){
      const m=/^\d{1,3}/.exec(lit.slice(i+1));
      if(m){o.push(parseInt(m[0],10)&255);i+=1+m[0].length;continue;}
      const esc={'n':10,'t':9,'r':13,'\\':92,'"':34,"'":39,'0':0}[lit[i+1]];
      if(esc!==undefined){o.push(esc);i+=2;continue;}
      i+=2;continue;
    }
    o.push(lit.charCodeAt(0)&255);i++;
  }
  return Uint8Array.from(o);
}

function toStr(u8){ let s=''; for(let i=0;i<u8.length;i++) s+=String.fromCharCode(u8[i]); return s; }

// clean residue from XOR sweep
function cleanXor(s){
  // replace non-printable with nothing
  return s.replace(/[^\x20-\x7E]/g, '');
}

// check if a candidate decryption contains one of our juicy tokens
const juicy = /https?:\/\/|discord|webhook|HttpGet|loadstring|check|key|white|auth|token|api|\.php|\.json|init|loader|stage/i;

function process(src){
  try{
    log(`loaded: ${src.length} bytes`);
    
    const i = src.indexOf('local C');
    if(i<0) throw new Error('No local C table');
    
    let b = src.indexOf('{', i);
    let depth=0, end=-1;
    for(let j=b;j<src.length;j++){
      const c=src[j];
      if(c==='{')depth++;
      else if(c==='}'){depth--;if(depth===0){end=j;break;}}
      else if(c==='"'){j++;while(j<src.length){if(src[j]==='\\')j+=2;else if(src[j]==='"')break;else j++;}}
    }
    if(end<0) throw new Error('Unbalanced braces');

    const table = src.slice(b+1,end);
    const lits=[]; let k=0;
    while(k<table.length){
      if(table[k]==='"'){
        let j=k+1, buf='';
        while(j<table.length){
          if(table[j]==='\\'){buf+=table[j]+table[j+1];j+=2;continue;}
          if(table[j]==='"')break;
          buf+=table[j];j++;
        }
        lits.push(buf); k=j+1;
      } else k++;
    }
    log(`extracted ${lits.length} strings. sweeping...`);

    let C = lits.map(decEsc);
    let hits=0, outHtml='';

    C.forEach((u8, idx) => {
      let rawStr = toStr(u8);

      // try direct base64
      let b64Str = null;
      try {
        let s = rawStr.replace(/-/g, '+').replace(/_/g, '/');
        while(s.length % 4) s += '=';
        b64Str = atob(s);
      } catch(e) {}

      // try xor sweep on raw + b64
      const tryXor = (str) => {
        for(let key=1; key<255; key++){
          let dec = '';
          for(let x=0; x<str.length; x++) dec += String.fromCharCode(str.charCodeAt(x) ^ key);
          let clean = cleanXor(dec);
          if(clean.length >= 4 && juicy.test(clean)) return clean;
        }
        return null;
      };

      // candidate list, in order of preference
      let found = null;
      if (rawStr && juicy.test(rawStr)) found = rawStr;
      else if (b64Str && juicy.test(b64Str)) found = b64Str;
      else {
        let xr = tryXor(rawStr);
        if (xr) found = xr;
        else if (b64Str) {
          let xb = tryXor(b64Str);
          if (xb) found = xb;
        }
      }

      if(found) {
        outHtml += `<span class="hit">[${idx}] ${found}</span>`;
        hits++;
      }
    });

    out.innerHTML = outHtml || '<div style="color:#888">no hits.</div>';
    out.style.display = 'block';
    log(`done. ${hits} hits.`);
  } catch(e) {
    log('CRASH: '+e.message, true);
  }
}
</script>
</body>
</html>
