<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VEX // FENGARI MONSTER</title>
<style>
  :root { --bg:#050508; --panel:#0d0d12; --border:#1f1f2a; --txt:#d1d1d6; --acc:#00ffcc; --warn:#ffaa00; --err:#ff3366; }
  body { background:var(--bg); color:var(--txt); font:14px ui-monospace,monospace; padding:16px; margin:0; }
  h1 { font-size:18px; color:var(--acc); margin:0 0 16px 0; text-transform:uppercase; letter-spacing:2px; }
  #drop { border:2px dashed var(--border); border-radius:12px; padding:40px 20px; text-align:center; color:#888; margin-bottom:16px; cursor:pointer; background:var(--panel); }
  #drop.hot { border-color:var(--acc); color:var(--acc); background:rgba(0,255,204,0.05); }
  #status { color:var(--acc); margin-bottom:12px; font-weight:bold; }
  #status.err { color:var(--err); }
  #out { background:#000; border:1px solid var(--border); border-radius:8px; padding:16px; white-space:pre-wrap; word-break:break-all; max-height:65vh; overflow-y:auto; font-size:13px; display:none; }
  .hit { color:var(--warn); font-weight:bold; display:block; margin:6px 0; padding:10px; background:rgba(255,170,0,0.06); border-left:3px solid var(--warn); border-radius:4px; }
  input[type=file]{ display:none; }
</style>

<!-- INLINE FENGARI VM (No CDN, runs locally) -->
<script src="https://cdn.jsdelivr.net/npm/fengari-web@0.1.4/dist/fengari-web.js"></script>
</head>
<body>

<h1>VEX // FENGARI MONSTER</h1>
<div id="drop"><b>TAP HERE</b> to load target</div>
<input type="file" id="fileInput" accept=".txt,.lua">
<div id="status">waiting...</div>
<div id="out"></div>

<script>
const drop=document.getElementById('drop'),fi=document.getElementById('fileInput'),
      st=document.getElementById('status'),out=document.getElementById('out');

drop.onclick=()=>fi.click();
drop.addEventListener('dragover',e=>{e.preventDefault();drop.classList.add('hot')});
drop.addEventListener('dragleave',()=>drop.classList.remove('hot'));
drop.addEventListener('drop',e=>{e.preventDefault();drop.classList.remove('hot');if(e.dataTransfer.files.length)load(e.dataTransfer.files[0]);});
fi.onchange=e=>{if(e.target.files.length)load(e.target.files[0]);};

function log(msg,isErr){
  out.style.display='block';
  out.innerHTML += `<div style="color:${isErr?'var(--err)':'var(--acc)'}; margin-bottom:4px;">[VM] ${msg}</div>`;
  st.textContent=msg;
  if(isErr) st.style.color='var(--err)'; else st.style.color='var(--acc)';
}

function load(file){
  st.textContent=`reading ${file.name}...`; out.innerHTML='';
  const r=new FileReader();
  r.onload=e=>setTimeout(()=>execute(e.target.result),100);
  r.readAsText(file);
}

function execute(src) {
  if (typeof FengariWeb === 'undefined') {
    log('Fengari VM failed to load from CDN. Check internet.', true);
    return;
  }
  
  log('VM loaded. Injecting script...');
  
  // The wrapper mocks the Roblox environment and hooks string.char
  const wrapper = `
    local real_print = print
    
    -- Hook string.char to catch the VM's decryption output
    local old_char = string.char
    string.char = function(...)
        local s = old_char(...)
        if #s >= 4 then
            local low = string.lower(s)
            if string.find(low, "http") or string.find(low, "key") or string.find(low, "discord") or string.find(low, "webhook") or string.find(low, "api") or string.find(low, "init") then
                real_print("JUICY_HIT: " .. s)
            end
        end
        return s
    end
    
    -- Mock Roblox functions so the script doesn't crash trying to call them
    game = {
        HttpGet = function(url) real_print("JUICY_HIT_HTTPGET: " .. url) return "" end,
        GetService = function() return {HttpGet = function() return "" end} end,
        Players = { LocalPlayer = { Name = "Vex", UserId = 1 } }
    }
    getgenv = function() return {} end
    wait = function() end
    task = { wait = function() end, spawn = function(f) f() end }
    loadstring = function(s) real_print("JUICY_HIT_LOADSTRING") return function() end end
    warn = real_print
    pcall = pcall

    -- Execute the target
    local ok, err = pcall(function()
        ${src}
    end)
    
    if not ok then real_print("VM_ERROR: " .. tostring(err)) end
    real_print("VM_FINISHED")
  `;

  // Redirect Lua's print to our UI
  FengariWeb.set_print_fn(function(text) {
    if (text.indexOf('JUICY_HIT:') === 0) {
      let cleaned = text.replace('JUICY_HIT: ', '');
      out.innerHTML += `<span class="hit">DECRYPTED: ${cleaned}</span>`;
    } else if (text.indexOf('JUICY_HIT_HTTPGET:') === 0) {
      let cleaned = text.replace('JUICY_HIT_HTTPGET: ', '');
      out.innerHTML += `<span class="hit">URL FETCH: ${cleaned}</span>`;
    } else if (text === 'VM_FINISHED') {
      log('Script finished executing.');
    } else if (text.indexOf('VM_ERROR:') === 0) {
      log('Lua Crash: ' + text, true);
    } else {
      // Output normal prints if they look like text
      if (text.indexOf('http') > -1 || text.length < 100) {
         out.innerHTML += `<div style="color:#555; font-size:11px;">${text}</div>`;
      }
    }
  });

  try {
    // Run the VM
    FengariWeb.run(wrapper);
  } catch(e) {
    log('JS CRASH: ' + e.message, true);
  }
}
</script>
</body>
</html>
