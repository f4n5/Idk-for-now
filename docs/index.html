<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>econ string pool dumper</title>
<style>
  body{background:#0d0d0f;color:#c9f;font:14px ui-monospace,monospace;padding:16px;margin:0}
  #drop{border:2px dashed #4a4;border-radius:12px;padding:40px 16px;text-align:center;color:#7d7;margin-bottom:12px}
  #drop.hot{background:#142;border-color:#7f7}
  #out{white-space:pre-wrap;word-break:break-all;background:#000;padding:12px;border-radius:8px;max-height:70vh;overflow:auto}
  .k{color:#fa4}.u{color:#4cf}.h{color:#f66;font-weight:bold}
  button{background:#223;color:#c9f;border:1px solid #446;padding:8px 14px;border-radius:6px;margin:6px 0}
</style>
</head>
<body>
<div id="drop">drop Econ.txt here<br><small>or tap to pick a file</small>
  <input type="file" id="f" accept=".txt,.lua" hidden>
</div>
<button id="go">re-parse</button>
<div id="out">waiting for file…</div>

<script>
const drop=document.getElementById('drop'), fi=document.getElementById('f'),
      out=document.getElementById('out'), go=document.getElementById('go');
let SRC='';

drop.onclick=()=>fi.click();
fi.onchange=e=>{ if(e.target.files[0]) read(e.target.files[0]); };
['dragover','dragenter'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('hot')}));
['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('hot')}));
drop.addEventListener('drop',e=>{ const f=e.dataTransfer.files[0]; if(f) read(f); });

function read(f){
  const r=new FileReader();
  r.onload=()=>{ SRC=r.result; out.textContent='loaded '+f.name+' ('+SRC.length+' bytes) — parsing…'; setTimeout(parse,30); };
  r.readAsText(f);
}

function decEsc(lit){ // lua decimal escapes -> Uint8Array
  const out=[]; let i=0;
  while(i<lit.length){
    const c=lit[i];
    if(c==='\\'){
      const m=/^\d{1,3}/.exec(lit.slice(i+1));
      if(m){ out.push(parseInt(m[0],10)&255); i+=1+m[0].length; continue; }
      const esc={'n':10,'t':9,'r':13,'\\':92,'"':34,"'":39,'0':0}[lit[i+1]];
      if(esc!==undefined){ out.push(esc); i+=2; continue; }
      i+=2; continue;
    }
    out.push(c.charCodeAt(0)&255); i++;
  }
  return Uint8Array.from(out);
}

function b64(u8){ // base64 decode bytes -> bytes
  try{ const s=String.fromCharCode(...u8); return Uint8Array.from(atob(s),c=>c.charCodeAt(0)); }
  catch(e){ return null; }
}

function printable(u8){
  // keep if mostly ascii-ish; return string or null
  let good=0;
  for(const b of u8){ if(b>=32&&b<127||b===9||b===10||b===13) good++; }
  return good>=Math.max(1,Math.floor(u8.length*0.7)) ? new TextDecoder('latin-1').decode(u8) : null;
}

function parse(){
  out.innerHTML='';
  // 1) pull C table literal
  const m=/local\s+C\s*=\s*\{(.*?)\}\s*for\s+h,v\s+in\s+ipairs/s.exec(SRC);
  if(!m){ out.innerHTML='<span class="h">no C table found.</span> header cut? make sure the file starts before return(function'; return; }
  const raw=m[1];
  const lits=[...raw.matchAll(/"((?:\\.|[^"\\])*)"/g)].map(x=>x[1]);
  if(!lits.length){ out.innerHTML='<span class="h">no string literals in C.</span>'; return; }

  // decode decimal escapes
  let C=lits.map(decEsc);
  let lines=[];

  // 2) pass A: raw decoded (order as-is) — strings are base64 ciphertext in Luraph
  lines.push('==== pass A: raw decode ('+C.length+' entries) ====');
  C.forEach((u8,i)=>{
    const p=printable(u8);
    if(p) lines.push('['+i+'] '+p);
  });

  // 3) pass B: base64-decode every entry, then printable-filter
  lines.push('\n==== pass B: base64 decrypted ====');
  C.forEach((u8,i)=>{
    const d=b64(u8);
    if(!d) return;
    const p=printable(d);
    if(p) lines.push('['+i+'] '+p);
  });

  // 4) pass C: xor heuristics — single-byte xor 0..255, score printable
  lines.push('\n==== pass C: single-byte xor sweep (score hits) ====');
  C.forEach((u8,i)=>{
    if(u8.length<4) return;
    let best=null,bestScore=0;
    for(let k=0;k<256;k++){
      let s=0, txt='';
      for(const b of u8){ const x=b^k; txt+=String.fromCharCode(x); if(x>=32&&x<127) s++; }
      if(s>bestScore){ bestScore=s; best=txt; }
    }
    if(best && bestScore>=Math.floor(u8.length*0.8))
      lines.push('['+i+'] k? '+best);
  });

  // 5) grep-worthy highlight
  const juicy=/https?:\/\/|discord|webhook|HttpGet|loadstring|check|key|white|auth|token|api|\.php|\.json|init|loader|stage/i;
  const hits=[];
  C.forEach((u8,i)=>{
    const tries=[printable(u8), (d=>d?printable(d):null)(b64(u8))];
    tries.forEach(t=>{ if(t && juicy.test(t)) hits.push('['+i+'] '+t); });
  });
  lines.unshift('==== JUICY HITS ====\n'+(hits.length?hits.join('\n'):'(none in static passes — likely needs VM emu)')+'\n');

  out.textContent=lines.join('\n');
}

go.onclick=parse;
</script>
</body>
</html>
