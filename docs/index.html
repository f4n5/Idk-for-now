<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VEX // ECON CRACKER v5</title>
<style>
  body{background:#0a0a0c;color:#e0e0e0;font:14px ui-monospace,monospace;padding:12px;margin:0}
  h1{font-size:16px;color:#00ffcc;margin:0 0 10px}
  #drop{border:2px dashed #333;border-radius:8px;padding:30px 10px;text-align:center;color:#888;margin-bottom:12px;cursor:pointer}
  #drop.hot{border-color:#00ffcc;color:#00ffcc;background:rgba(0,255,204,.05)}
  #status{color:#00ffcc;margin-bottom:8px;font-weight:bold;min-height:16px;word-break:break-all}
  #status.error{color:#ff3366}
  #log{background:#000;border:1px solid #222;border-radius:6px;padding:10px;white-space:pre-wrap;word-break:break-all;max-height:60vh;overflow-y:auto;font-size:12px;display:none}
  input[type=file]{display:none}
</style>
</head>
<body>
<h1>VEX // ECON CRACKER v5</h1>
<div id="drop"><b>TAP HERE</b> to load Econ.txt</div>
<input type="file" id="fileInput" accept=".txt,.lua">
<div id="status">waiting...</div>
<div id="log"></div>

<script>
const drop=document.getElementById('drop'),fi=document.getElementById('fileInput'),
      st=document.getElementById('status'),log=document.getElementById('log');
drop.onclick=()=>fi.click();
drop.addEventListener('dragover',e=>{e.preventDefault();drop.classList.add('hot')});
drop.addEventListener('dragleave',()=>drop.classList.remove('hot'));
drop.addEventListener('drop',e=>{e.preventDefault();drop.classList.remove('hot');if(e.dataTransfer.files.length)load(e.dataTransfer.files[0]);});
fi.onchange=e=>{if(e.target.files.length)load(e.target.files[0]);};

function print(msg,isErr){
  log.style.display='block';
  log.innerHTML += `<div style="color:${isErr?'#ff3366':'#00ffcc'}">${msg}</div>`;
  st.textContent=msg;
  if(isErr) st.className='error'; else st.className='';
}

function load(file){
  st.textContent=`reading ${file.name} (${file.size}b)...`; log.innerHTML='';
  const r=new FileReader();
  r.onload=e=>setTimeout(()=>process(e.target.result),50);
  r.onerror=()=>print('FileReader died.',true);
  r.readAsText(file);
}

function process(src){
  try{
    print(`file size: ${src.length} chars`);
    
    // --- CHECK IF IT'S A STUB ---
    const isStub = src.length < 50000;
    if(isStub){
      print(`WARNING: This is a loader stub! (${src.length} bytes)`, true);
      print(`Looking for the download URL...`);
      const urlMatches = src.match(/https?:\/\/[^\s'"\]\)]+/g);
      if(urlMatches){
        urlMatches.forEach(u=>print(`FOUND URL: ${u}`));
        print(`\n>> BRO: Go to the above URL, download that file, and load IT here <<`);
      } else {
        print(`No URL found. Dumping raw file text.`);
      }
    }

    const i = src.indexOf('local C');
    if(i<0){
      print('No "local C" table found.', true);
      downloadTxt(src, 'Econ_Dump_Raw.txt');
      return;
    }

    print('found local C table! scanning...');
    let b = src.indexOf('{', i);
    let depth=0, end=-1;
    for(let j=b;j<src.length;j++){
      const c=src[j];
      if(c==='{')depth++;
      else if(c==='}'){depth--;if(depth===0){end=j;break;}}
      else if(c==='"'){j++;while(j<src.length){if(src[j]==='\\')j+=2;else if(src[j]==='"')break;else j++;}}
    }
    if(end<0) throw new Error('unbalanced braces — file cut off');

    const table = src.slice(b+1,end);
    print(`extracted table (${table.length} chars)`);

    const lits=[]; let k=0;
    while(k<table.length){
      if(table[k]==='"'){
        let j=k+1, buf='';
        while(j<table.length){
          if(table[j]==='\\'){buf+=table[j]+table[j+1];j+=2;continue;}
          if(table[j]==='"')break;
          buf+=table[j];j++;
        }
        lits.push(buf); k=j+1;
      } else k++;
    }
    print(`found ${lits.length} string literals. decoding...`);

    const decoded = lits.map(decEsc);
    let outTxt = '=== VEX ECON DUMP ===\n\n';

    decoded.forEach((u8,idx)=>{
      let p=toStr(u8);
      let b64=b64d(u8);
      let pb=b64?toStr(b64):null;
      
      if(p && p.length > 2) outTxt += `[${idx}] RAW: ${p}\n`;
      if(pb && pb.length > 2) outTxt += `[${idx}] B64: ${pb}\n`;
      if(!p && !pb) outTxt += `[${idx}] <unreadable bytes>\n`;
    });

    print(`decoded all strings.`, false);
    downloadTxt(outTxt, 'Econ_Decoded.txt');
    print(`DOWNLOADED: Econ_Decoded.txt`);

  }catch(e){
    print('CRASH: '+e.message, true);
  }
}

function decEsc(lit){
  const o=[];let i=0;
  while(i<lit.length){
    if(lit[i]==='\\'){
      const m=/^\d{1,3}/.exec(lit.slice(i+1));
      if(m){o.push(parseInt(m[0],10)&255);i+=1+m[0].length;continue;}
      const esc={'n':10,'t':9,'r':13,'\\':92,'"':34,"'":39,'0':0}[lit[i+1]];
      if(esc!==undefined){o.push(esc);i+=2;continue;}
      i+=2;continue;
    }
    o.push(lit.charCodeAt(0)&255);i++;
  }
  return Uint8Array.from(o);
}

// FATAL FIX: Mobile browsers hate TextDecoder('latin-1'). We do it manually.
function toStr(u8) {
  let s = '';
  for (let i = 0; i < u8.length; i++) {
    s += String.fromCharCode(u8[i]);
  }
  // check if it's printable
  let good = 0;
  for (let i = 0; i < u8.length; i++) {
    if ((u8[i] >= 32 && u8[i] < 127) || u8[i] === 9 || u8[i] === 10 || u8[i] === 13) good++;
  }
  return (good >= u8.length * 0.75) ? s : null;
}

function b64d(u8){
  try{const s=String.fromCharCode(...u8);if(!/^[A-Za-z0-9+/=]+$/.test(s))return null;return Uint8Array.from(atob(s),c=>c.charCodeAt(0));}catch(e){return null;}
}

function downloadTxt(text, filename){
  const blob=new Blob([text],{type:'text/plain'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=filename;
  document.body.appendChild(a);a.click();
  setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(url);},100);
}
</script>
</body>
</html>
