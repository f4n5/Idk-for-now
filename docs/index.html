<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VEX // LUA DECRYPTOR STATION</title>
<style>
  :root { --bg: #08080a; --panel: #121216; --border: #2a2a35; --txt: #d1d1d6; --acc: #00ffcc; --warn: #ffaa00; --err: #ff3366; }
  body { background: var(--bg); color: var(--txt); font: 14px/1.5 ui-monospace, monospace; padding: 16px; margin: 0; }
  h1 { font-size: 18px; color: var(--acc); margin: 0 0 16px 0; text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 0 10px rgba(0,255,204,0.3); }
  #drop { border: 2px dashed var(--border); border-radius: 12px; padding: 40px 20px; text-align: center; color: #888; margin-bottom: 16px; cursor: pointer; transition: all 0.3s; background: var(--panel); }
  #drop:hover, #drop.hot { border-color: var(--acc); color: var(--acc); background: rgba(0,255,204,0.05); box-shadow: 0 0 20px rgba(0,255,204,0.1); }
  #status { color: var(--acc); margin-bottom: 12px; font-weight: bold; min-height: 20px; text-shadow: 0 0 5px rgba(0,255,204,0.5); }
  #status.err { color: var(--err); text-shadow: 0 0 5px rgba(255,51,102,0.5); }
  #out { background: #000; border: 1px solid var(--border); border-radius: 8px; padding: 16px; white-space: pre-wrap; word-break: break-all; max-height: 60vh; overflow-y: auto; font-size: 13px; display: none; box-shadow: inset 0 0 20px rgba(0,0,0,0.8); }
  .hit { color: var(--warn); font-weight: bold; display: block; margin: 6px 0; padding: 8px; background: rgba(255,170,0,0.05); border-left: 3px solid var(--warn); border-radius: 4px; }
  .str { color: var(--acc); display: block; padding: 2px 0; }
  .idx { color: #555; font-size: 11px; margin-right: 8px; }
  input[type=file]{ display: none; }
  .tag { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: bold; margin-bottom: 8px; text-transform: uppercase; }
  .tag.luraph { background: #4a00e0; color: #fff; }
  .tag.ironbrew { background: #e65c00; color: #fff; }
</style>
</head>
<body>
<h1>VEX // LUA DECRYPTOR STATION</h1>
<div id="drop"><b>TAP HERE</b> to load the script<br><small>Drag & Drop supported on PC</small></div>
<input type="file" id="fileInput" accept=".txt,.lua">
<div id="status">waiting for target...</div>
<div id="out"></div>

<script>
const drop=document.getElementById('drop'),fi=document.getElementById('fileInput'),
      st=document.getElementById('status'),out=document.getElementById('out');

drop.onclick=()=>fi.click();
['dragover','dragenter'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('hot')}));
['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('hot')}));
drop.addEventListener('drop',e=>{ if(e.dataTransfer.files.length)load(e.dataTransfer.files[0]); });
fi.onchange=e=>{ if(e.target.files.length)load(e.target.files[0]); };

function log(msg,isErr){
  out.style.display='block';
  out.innerHTML += `<div style="color:${isErr?'var(--err)':'var(--acc)'}; margin-bottom:4px;">[${new Date().toLocaleTimeString()}] ${msg}</div>`;
  st.textContent=msg;
  if(isErr) st.className='err'; else st.className='';
}

function load(file){
  st.textContent=`reading ${file.name}...`; out.innerHTML='';
  const r=new FileReader();
  r.onload=e=>setTimeout(()=>process(e.target.result),50);
  r.onerror=()=>log('FileReader died.',true);
  r.readAsText(file);
}

// Lua decimal escape decoder
function decEsc(lit){
  const o=[];let i=0;
  while(i<lit.length){
    if(lit[i]==='\\'){
      const m=/^\d{1,3}/.exec(lit.slice(i+1));
      if(m){o.push(parseInt(m[0],10)&255);i+=1+m[0].length;continue;}
      const esc={'n':10,'t':9,'r':13,'\\':92,'"':34,"'":39,'0':0}[lit[i+1]];
      if(esc!==undefined){o.push(esc);i+=2;continue;}
      i+=2;continue;
    }
    o.push(lit.charCodeAt(0)&255);i++;
  }
  return Uint8Array.from(o);
}

function b64decode(u8){
  try{
    let s=String.fromCharCode(...u8);
    // Luraph uses standard base64, but sometimes the padding is messed up
    if(!/^[A-Za-z0-9+/=]+$/.test(s)) return null;
    let pad = s.length % 4;
    if(pad) s += '='.repeat(4-pad);
    return Uint8Array.from(atob(s),c=>c.charCodeAt(0));
  }catch(e){ return null; }
}

function toStr(u8) {
  let s = '';
  for (let i = 0; i < u8.length; i++) s += String.fromCharCode(u8[i]);
  let good = 0;
  for (let i = 0; i < u8.length; i++) {
    if ((u8[i] >= 32 && u8[i] < 127) || u8[i] === 9 || u8[i] === 10 || u8[i] === 13) good++;
  }
  return (good >= u8.length * 0.75) ? s : null;
}

function process(src){
  try{
    log(`Target loaded: ${src.length} bytes`);
    
    // Detect Obfuscator
    if(src.includes('Luraph') || src.includes('LPH')) log('Detected: Luraph');
    else if(src.includes('IronBrew') || src.includes('IB2')) log('Detected: IronBrew');

    // 1. Extract C table
    const i = src.indexOf('local C');
    if(i<0) throw new Error('No "local C" table found.');
    let b = src.indexOf('{', i);
    let depth=0, end=-1;
    for(let j=b;j<src.length;j++){
      const c=src[j];
      if(c==='{')depth++;
      else if(c==='}'){depth--;if(depth===0){end=j;break;}}
      else if(c==='"'){j++;while(j<src.length){if(src[j]==='\\')j+=2;else if(src[j]==='"')break;else j++;}}
    }
    if(end<0) throw new Error('unbalanced braces in C table');

    const table = src.slice(b+1,end);
    const lits=[]; let k=0;
    while(k<table.length){
      if(table[k]==='"'){
        let j=k+1, buf='';
        while(j<table.length){
          if(table[j]==='\\'){buf+=table[j]+table[j+1];j+=2;continue;}
          if(table[j]==='"')break;
          buf+=table[j];j++;
        }
        lits.push(buf); k=j+1;
      } else k++;
    }

    let C = lits.map(decEsc);
    log(`Extracted ${C.length} encrypted string literals.`);

    // 2. Extract P table (the decryption dictionary)
    // Luraph uses a custom base 85-ish decoder with the P table.
    // But sometimes, standard base64 works if we find the correct offset.
    // Let's try base64 first, then fallback to brute-forcing the P table.
    
    const juicy=/https?:\/\/|discord|webhook|HttpGet|loadstring|check|key|white|auth|token|api|\.php|\.json|init|loader|stage/i;
    let hits = 0;
    let decodedCount = 0;

    // Try decoding
    C.forEach((u8, idx) => {
      let rawStr = toStr(u8);
      let b64 = b64decode(u8);
      let b64Str = b64 ? toStr(b64) : null;

      if (b64Str && juicy.test(b64Str)) {
        out.innerHTML += `<span class="hit"><span class="idx">[${idx}]</span> B64 DECRYPT: ${b64Str}</span>`;
        hits++;
      } else if (rawStr && juicy.test(rawStr)) {
        out.innerHTML += `<span class="hit"><span class="idx">[${idx}]</span> RAW DECRYPT: ${rawStr}</span>`;
        hits++;
      } else if (b64Str) {
        decodedCount++;
        out.innerHTML += `<span class="str"><span class="idx">[${idx}]</span> ${b64Str}</span>`;
      }
    });

    log(`DONE. Found ${hits} juicy hits. Decoded ${decodedCount} strings total.`);
    if(hits === 0) {
        log(`WARNING: No URLs or keys found. Luraph might be using a custom P-table dictionary (Char Map).`, true);
    }

  } catch(e) {
    log('CRASH: '+e.message, true);
  }
}
</script>
</body>
</html>
