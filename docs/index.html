<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VEX // ECON VM CRACKER</title>
<style>
  body{background:#0a0a0c;color:#e0e0e0;font:14px ui-monospace,monospace;padding:12px;margin:0}
  h1{font-size:16px;color:#00ffcc;margin:0 0 10px}
  #drop{border:2px dashed #333;border-radius:8px;padding:30px 10px;text-align:center;color:#888;margin-bottom:12px;cursor:pointer}
  #status{color:#00ffcc;margin-bottom:8px;font-weight:bold;min-height:16px;word-break:break-all}
  #status.error{color:#ff3366}
  #out{background:#000;border:1px solid #222;border-radius:6px;padding:10px;white-space:pre-wrap;word-break:break-all;max-height:60vh;overflow-y:auto;font-size:12px;display:none}
  .hit{color:#ffaa00;font-weight:bold;display:block;margin:4px 0;padding:4px;background:rgba(255,170,0,.1);border-radius:3px}
  input[type=file]{display:none}
</style>
</head>
<body>
<h1>VEX // ECON VM CRACKER</h1>
<div id="drop"><b>TAP HERE</b> to load Econ.txt</div>
<input type="file" id="fileInput" accept=".txt,.lua">
<div id="status">initializing Lua VM (requires internet)...</div>
<div id="out"></div>

<!-- Load Fengari (Lua VM in JS) -->
<script src="https://cdn.jsdelivr.net/npm/fengari-web@0.1.4/dist/fengari-web.js"></script>

<script>
const drop=document.getElementById('drop'),fi=document.getElementById('fileInput'),
      st=document.getElementById('status'),out=document.getElementById('out');
drop.onclick=()=>fi.click();
drop.addEventListener('dragover',e=>{e.preventDefault();drop.classList.add('hot')});
drop.addEventListener('dragleave',()=>drop.classList.remove('hot'));
drop.addEventListener('drop',e=>{e.preventDefault();drop.classList.remove('hot');if(e.dataTransfer.files.length)load(e.dataTransfer.files[0]);});
fi.onchange=e=>{if(e.target.files.length)load(e.target.files[0]);};

function log(msg,isErr){
  out.style.display='block';
  out.innerHTML += `<div style="color:${isErr?'#ff3366':'#00ffcc'}">${msg}</div>`;
  st.textContent=msg;
  if(isErr) st.className='error'; else st.className='';
}

function load(file){
  st.textContent=`reading ${file.name}...`; out.innerHTML='';
  const r=new FileReader();
  r.onload=e=>setTimeout(()=>execute(e.target.result),100);
  r.onerror=()=>log('FileReader died.',true);
  r.readAsText(file);
}

function execute(src){
  log('File loaded. Starting Lua VM...');
  
  // 1. Prepare the Lua wrapper with the hook
  const hook = `
    local real_print = print
    local target_strings = {}
    
    -- Hook string.char to catch decrypted strings
    local old_char = string.char
    string.char = function(...)
        local s = old_char(...)
        if #s >= 4 then
            local low = string.lower(s)
            if string.find(low, "http") or string.find(low, "key") or string.find(low, "discord") or string.find(low, "loadstring") or string.find(low, "webhook") or string.find(low, "init") or string.find(low, "api") then
                real_print("JUICY_HIT: " .. s)
            end
        end
        return s
    end
    
    -- Hook game:HttpGet in case it tries to download a second stage
    game = {
        HttpGet = function(url)
            real_print("JUICY_HIT: HTTPGET: " .. url)
            return ""
        end,
        GetService = function() return {HttpGet = function() return "" end} end
    }
    getgenv = function() return {} end
    wait = function() end
    task = { wait = function() end, spawn = function(f) f() end }
    loadstring = function(s) return function() end end

    -- Sandbox the actual source
    local ok, err = pcall(function()
        ${src}
    end)
    
    if not ok then real_print("VM_ERR: " .. tostring(err)) end
    real_print("VM_FINISHED")
  `;

  // 2. Run it through fengari
  try {
    // Capture Lua's print output
    FengariWeb.set_print_fn(function(text) {
      if (text.indexOf('JUICY_HIT:') === 0) {
        let cleaned = text.replace('JUICY_HIT: ', '');
        out.innerHTML += `<span class="hit">${cleaned}</span>`;
      } else if (text === 'VM_FINISHED') {
        log('DONE. VM finished. If hits were found, they are above.');
      } else if (text.indexOf('VM_ERR:') === 0) {
        log('Lua Error: ' + text, true);
      }
    });

    // Execute the wrapped code
    FengariWeb.run(hook);
    
  } catch(e) {
    log('JS CRASH: ' + e.message, true);
  }
}
</script>
</body>
</html>
