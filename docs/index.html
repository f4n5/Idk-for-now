<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VEX // ECON CRACKER</title>
<style>
  :root { --bg: #0a0a0c; --fg: #e0e0e0; --acc: #00ffcc; --err: #ff3366; --box: #141418; }
  body { background: var(--bg); color: var(--fg); font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; padding: 12px; margin: 0; }
  h1 { font-size: 16px; color: var(--acc); margin: 0 0 12px 0; letter-spacing: 1px; text-transform: uppercase; }
  #drop { border: 2px dashed #333; border-radius: 8px; padding: 30px 10px; text-align: center; color: #888; margin-bottom: 12px; cursor: pointer; transition: all 0.2s; }
  #drop:active, #drop.hot { border-color: var(--acc); color: var(--acc); background: rgba(0,255,204,0.05); }
  #status { color: var(--acc); margin-bottom: 8px; font-weight: bold; min-height: 18px; }
  #status.error { color: var(--err); }
  #out { background: #000; border: 1px solid #222; border-radius: 6px; padding: 10px; white-space: pre-wrap; word-break: break-all; max-height: 65vh; overflow-y: auto; font-size: 12px; display: none; }
  .hit { color: #ffaa00; font-weight: bold; background: rgba(255,170,0,0.1); display: block; margin: 2px 0; padding: 2px 4px; border-radius: 3px; }
  .b64 { color: #00aaff; }
  .raw { color: #888; }
  input[type="file"] { display: none; }
</style>
</head>
<body>

<h1>VEX // ECON CRACKER</h1>

<div id="drop">
  <b>TAP HERE</b> to load Econ.txt<br>
  <small>(desktop: you can drag & drop too)</small>
</div>

<input type="file" id="fileInput" accept=".txt,.lua">

<div id="status">waiting for target...</div>
<div id="out"></div>

<script>
const drop = document.getElementById('drop');
const fileInput = document.getElementById('fileInput');
const statusEl = document.getElementById('status');
const outEl = document.getElementById('out');

// --- UI HANDLERS ---
drop.addEventListener('click', () => fileInput.click());

drop.addEventListener('dragover', (e) => {
  e.preventDefault();
  drop.classList.add('hot');
});
drop.addEventListener('dragleave', () => drop.classList.remove('hot'));
drop.addEventListener('drop', (e) => {
  e.preventDefault();
  drop.classList.remove('hot');
  if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
});

fileInput.addEventListener('change', (e) => {
  if (e.target.files.length) handleFile(e.target.files[0]);
});

// --- LOGIC ---
function handleFile(file) {
  statusEl.className = '';
  statusEl.textContent = `reading ${file.name} (${file.size} bytes)...`;
  outEl.style.display = 'none';
  outEl.innerHTML = '';

  const reader = new FileReader();
  
  reader.onload = (e) => {
    const src = e.target.result;
    statusEl.textContent = 'parsing...';
    // let the UI update before we block the thread
    setTimeout(() => parseSrc(src), 50);
  };

  reader.onerror = () => {
    statusEl.className = 'error';
    statusEl.textContent = 'ERROR: FileReader failed. Phone browser is acting up.';
  };

  reader.readAsText(file);
}

function decodeLuaEscapes(lit) {
  const out = [];
  let i = 0;
  while (i < lit.length) {
    if (lit[i] === '\\') {
      const m = /^\d{1,3}/.exec(lit.slice(i + 1));
      if (m) {
        out.push(parseInt(m[0], 10) & 255);
        i += 1 + m[0].length;
        continue;
      }
      const esc = { 'n': 10, 't': 9, 'r': 13, '\\': 92, '"': 34, "'": 39, '0': 0 }[lit[i+1]];
      if (esc !== undefined) {
        out.push(esc);
        i += 2;
        continue;
      }
      i += 2; continue;
    }
    out.push(lit.charCodeAt(0) & 255);
    i++;
  }
  return Uint8Array.from(out);
}

function tryB64(u8) {
  try {
    const s = String.fromCharCode(...u8);
    // check if it looks like base64 before decoding
    if (!/^[A-Za-z0-9+/=]+$/.test(s)) return null;
    return Uint8Array.from(atob(s), c => c.charCodeAt(0));
  } catch (e) {
    return null;
  }
}

function isPrintable(u8) {
  if (!u8 || u8.length === 0) return null;
  let good = 0;
  for (let i = 0; i < u8.length; i++) {
    const b = u8[i];
    if ((b >= 32 && b < 127) || b === 9 || b === 10 || b === 13) good++;
  }
  if (good >= u8.length * 0.75) {
    return new TextDecoder('latin-1').decode(u8);
  }
  return null;
}

function parseSrc(src) {
  try {
    // 1. Find the table
    const match = /local\s+C\s*=\s*\{(.*?)\}\s*for\s+h,v\s+in\s+ipairs/s.exec(src);
    if (!match) {
      throw new Error("Could not find 'local C = {...}' table. Make sure you saved the raw Lua, not the HTML error page.");
    }

    // 2. Extract strings
    const raw = match[1];
    const lits = [...raw.matchAll(/"((?:\\.|[^"\\])*)"/g)].map(m => m[1]);
    if (lits.length === 0) {
      throw new Error("Found the table, but no string literals inside it.");
    }

    statusEl.textContent = `found ${lits.length} strings. decoding...`;

    // 3. Decode
    const decoded = lits.map(decodeLuaEscapes);
    const hits = [];
    const others = [];

    // The magic keyword regex
    const juicy = /https?:\/\/|discord|webhook|HttpGet|loadstring|check|key|white|auth|token|api|\.php|\.json|init|loader|stage|executor/i;

    decoded.forEach((u8, idx) => {
      let foundText = null;
      let isHit = false;

      // Pass A: Raw
      let p = isPrintable(u8);
      if (p && juicy.test(p)) { foundText = p; isHit = true; }
      
      // Pass B: Base64
      const b64d = tryB64(u8);
      let pB64 = b64d ? isPrintable(b64d) : null;
      if (pB64 && juicy.test(pB64)) { 
        foundText = pB64; 
        isHit = true; 
      }

      // Pass C: XOR (only if not found yet)
      if (!isHit && u8.length > 3) {
        let bestScore = 0, bestTxt = null;
        for (let k = 1; k < 255; k++) {
          let score = 0, txt = '';
          for (let i = 0; i < u8.length; i++) {
            const x = u8[i] ^ k;
            txt += String.fromCharCode(x);
            if (x >= 32 && x < 127) score++;
          }
          if (score > bestScore) { bestScore = score; bestTxt = txt; }
        }
        if (bestTxt && juicy.test(bestTxt) && bestScore > u8.length * 0.8) {
          foundText = bestTxt;
          isHit = true;
        }
      }

      if (isHit) {
        hits.push(`<span class="hit">[${idx}] ${foundText}</span>`);
      } else if (pB64) {
        others.push(`<span class="b64">[${idx}] ${pB64}</span>`);
      } else if (p) {
        others.push(`<span class="raw">[${idx}] ${p}</span>`);
      }
    });

    // 4. Render
    let html = '';
    if (hits.length > 0) {
      html += `<div style="color:#00ffcc;font-weight:bold;margin-bottom:8px;">=== JUICY HITS ===</div>`;
      html += hits.join('\n') + '\n\n';
    } else {
      html += `<div style="color:#ff3366;font-weight:bold;margin-bottom:8px;">No juicy hits found. Dumping all readable strings below.</div>`;
    }

    if (others.length > 0) {
      html += `<div style="color:#888;margin-top:12px;margin-bottom:8px;">=== OTHER STRINGS ===</div>`;
      html += others.join('\n');
    }

    outEl.innerHTML = html || '<div style="color:#888">Nothing readable found.</div>';
    outEl.style.display = 'block';
    statusEl.textContent = `done. ${hits.length} hits, ${others.length} other strings.`;

  } catch (err) {
    statusEl.className = 'error';
    statusEl.textContent = 'ERROR: ' + err.message;
  }
}
</script>

</body>
</html>
