<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VEX // ECON KEY EXTRACTOR</title>
<style>
  body{background:#0a0a0c;color:#e0e0e0;font:14px ui-monospace,monospace;padding:12px;margin:0}
  h1{font-size:16px;color:#00ffcc;margin:0 0 10px}
  #drop{border:2px dashed #333;border-radius:8px;padding:30px 10px;text-align:center;color:#888;margin-bottom:12px;cursor:pointer}
  #status{color:#00ffcc;margin-bottom:8px;font-weight:bold;min-height:16px;word-break:break-all}
  #status.error{color:#ff3366}
  #out{background:#000;border:1px solid #222;border-radius:6px;padding:10px;white-space:pre-wrap;word-break:break-all;max-height:65vh;overflow-y:auto;font-size:12px;display:none}
  .hit{color:#ffaa00;font-weight:bold;display:block;margin:4px 0;padding:4px;background:rgba(255,170,0,.1);border-radius:3px}
  input[type=file]{display:none}
</style>
</head>
<body>
<h1>VEX // ECON KEY EXTRACTOR</h1>
<div id="drop"><b>TAP HERE</b> to load Econ.txt</div>
<input type="file" id="fileInput" accept=".txt,.lua">
<div id="status">waiting...</div>
<div id="out"></div>

<script>
const drop=document.getElementById('drop'),fi=document.getElementById('fileInput'),
      st=document.getElementById('status'),out=document.getElementById('out');
drop.onclick=()=>fi.click();
drop.addEventListener('dragover',e=>{e.preventDefault();drop.classList.add('hot')});
drop.addEventListener('dragleave',()=>drop.classList.remove('hot'));
drop.addEventListener('drop',e=>{e.preventDefault();drop.classList.remove('hot');if(e.dataTransfer.files.length)load(e.dataTransfer.files[0]);});
fi.onchange=e=>{if(e.target.files.length)load(e.target.files[0]);};

function log(msg,isErr){
  out.style.display='block';
  out.innerHTML += `<div style="color:${isErr?'#ff3366':'#00ffcc'}">${msg}</div>`;
  st.textContent=msg;
  if(isErr) st.className='error'; else st.className='';
}

function load(file){
  st.textContent=`reading ${file.name}...`; out.innerHTML='';
  const r=new FileReader();
  r.onload=e=>setTimeout(()=>process(e.target.result),50);
  r.onerror=()=>log('FileReader died.',true);
  r.readAsText(file);
}

function process(src){
  try{
    log(`File size: ${src.length} chars`);
    
    // 1. Find the key string.
    // Luraph usually builds a local variable right after C, e.g., local h="key_here"
    // Let's grep the first 5000 chars for string literals that look like keys (alphanumeric, len 8-64)
    const head = src.slice(0, 10000);
    
    // Look for a string that is assigned to a local var right after the table
    // Pattern: local <name>="<key>"
    const keyRegex = /local\s+[\w_]+\s*=\s*"([^"]{8,100})"/g;
    let m;
    const keys = [];
    while((m = keyRegex.exec(head)) !== null) {
       // Filter out decimals (the C table)
       if (!m[1].includes('\\')) keys.push(m[1]);
    }

    if(keys.length > 0){
       log(`Found ${keys.length} potential keys in header:`);
       keys.forEach(k => out.innerHTML += `<span class="hit">KEY CANDIDATE: ${k}</span>`);
    } else {
       log('No obvious key in header. Scanning whole file for local string assignments...');
       // Just grab any local = "..." that isn't the C table
       const wholeRegex = /local\s+[\w_]+\s*=\s*"([^"\\]{6,64})"/g;
       let hits = 0;
       while((m = wholeRegex.exec(src)) !== null) {
          out.innerHTML += `<span class="hit">POSSIBLE KEY: ${m[1]}</span>`;
          hits++;
          if(hits > 20) break;
       }
       if(hits===0) log('No plaintext keys found. Might be dynamically generated.', true);
    }

    // 2. Also dump the first 10 lines of the file after the C table to see what logic follows
    log('Dumping header logic (just to see what it does):');
    const afterC = src.indexOf('for h,v in ipairs');
    if(afterC > 0){
       let snippet = src.slice(afterC, afterC + 500);
       out.innerHTML += `<div style="color:#888">${snippet.replace(/</g, '&lt;')}</div>`;
    } else {
       log('Could not find "for h,v in ipairs" block.');
    }

  } catch(e) {
    log('CRASH: '+e.message, true);
  }
}
</script>
</body>
</html>
