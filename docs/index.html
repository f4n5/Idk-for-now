<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VEX // DEOBFUSCATOR STATION</title>
<style>
  :root { --bg: #050508; --panel: #0d0d12; --border: #1f1f2a; --txt: #d1d1d6; --acc: #00ffcc; --warn: #ffaa00; --err: #ff3366; --blue: #00aaff; }
  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--txt); font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; padding: 16px; margin: 0; overflow-x: hidden; }
  
  /* Animations */
  @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
  @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes glow { 0% { box-shadow: 0 0 5px var(--acc); } 50% { box-shadow: 0 0 20px var(--acc); } 100% { box-shadow: 0 0 5px var(--acc); } }
  
  h1 { font-size: 20px; color: var(--acc); margin: 0 0 20px 0; text-transform: uppercase; letter-spacing: 3px; text-shadow: 0 0 10px rgba(0,255,204,0.4); display: flex; align-items: center; gap: 10px; }
  h1::before { content: ''; display: inline-block; width: 12px; height: 12px; background: var(--acc); border-radius: 50%; animation: pulse 2s infinite; }
  
  #drop { border: 2px dashed var(--border); border-radius: 12px; padding: 40px 20px; text-align: center; color: #888; margin-bottom: 20px; cursor: pointer; transition: all 0.3s; background: var(--panel); }
  #drop:hover, #drop.hot { border-color: var(--acc); color: var(--acc); background: rgba(0,255,204,0.05); box-shadow: 0 0 30px rgba(0,255,204,0.1); transform: scale(1.01); }
  
  .status-bar { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 12px; margin-bottom: 16px; display: flex; align-items: center; gap: 12px; }
  .status-indicator { width: 10px; height: 10px; border-radius: 50%; background: var(--acc); animation: pulse 1s infinite; }
  .status-indicator.err { background: var(--err); animation: none; }
  #status { color: var(--acc); font-weight: bold; font-size: 13px; }
  
  .badges { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .badge { padding: 4px 10px; border-radius: 4px; font-size: 11px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; border: 1px solid transparent; }
  .badge.luraph { background: rgba(74,0,224,0.2); color: #a07aff; border-color: #4a00e0; }
  .badge.ironbrew { background: rgba(230,92,0,0.2); color: #ff9e5c; border-color: #e65c00; }
  .badge.moonsec { background: rgba(0,170,255,0.2); color: #5cd6ff; border-color: #00aaff; }
  .badge.unknown { background: rgba(255,51,102,0.2); color: #ff7099; border-color: #ff3366; }
  
  .results { background: #000; border: 1px solid var(--border); border-radius: 8px; padding: 16px; white-space: pre-wrap; word-break: break-all; max-height: 65vh; overflow-y: auto; font-size: 13px; display: none; box-shadow: inset 0 0 30px rgba(0,0,0,0.9); }
  
  .hit { color: var(--warn); font-weight: bold; display: block; margin: 6px 0; padding: 10px; background: rgba(255,170,0,0.05); border-left: 3px solid var(--warn); border-radius: 4px; animation: slideIn 0.3s ease-out; }
  .hit .label { font-size: 10px; color: #888; margin-right: 8px; text-transform: uppercase; background: #222; padding: 2px 4px; border-radius: 2px; }
  
  .str { color: var(--txt); display: block; padding: 3px 0; border-bottom: 1px solid #111; }
  .str:hover { background: #111; }
  .idx { color: #555; font-size: 11px; margin-right: 10px; user-select: none; }
  .blue { color: var(--blue); }
  
  input[type=file]{ display: none; }
  
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: #000; }
  ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--acc); }
</style>
</head>
<body>

<h1>VEX // DEOBFUSCATOR</h1>

<div id="drop">
  <b>TAP HERE</b> to load target<br>
  <small>desktop: drag & drop</small>
</div>
<input type="file" id="fileInput" accept=".txt,.lua">

<div class="status-bar">
  <div class="status-indicator" id="indicator"></div>
  <div id="status">waiting for target...</div>
</div>

<div class="badges" id="badges"></div>
<div class="results" id="out"></div>

<script>
const drop = document.getElementById('drop'),
      fi = document.getElementById('fileInput'),
      st = document.getElementById('status'),
      ind = document.getElementById('indicator'),
      out = document.getElementById('out'),
      badges = document.getElementById('badges');

drop.onclick = () => fi.click();
['dragover','dragenter'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('hot'); }));
['dragleave','drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('hot'); }));
drop.addEventListener('drop', e => { if(e.dataTransfer.files.length) load(e.dataTransfer.files[0]); });
fi.onchange = e => { if(e.target.files.length) load(e.target.files[0]); };

function log(msg, isErr) {
  out.style.display = 'block';
  st.textContent = msg;
  if(isErr) { st.style.color = 'var(--err)'; ind.classList.add('err'); }
  else { st.style.color = 'var(--acc)'; ind.classList.remove('err'); }
}

function addBadge(text, type) {
  badges.innerHTML += `<div class="badge ${type}">${text}</div>`;
}

function load(file) {
  st.textContent = `reading ${file.name}...`;
  out.innerHTML = ''; badges.innerHTML = '';
  const r = new FileReader();
  r.onload = e => setTimeout(() => process(e.target.result), 100);
  r.onerror = () => log('FileReader died.', true);
  r.readAsText(file);
}

// --- CORE LOGIC ---

function decEsc(lit){
  const o=[];let i=0;
  while(i<lit.length){
    if(lit[i]==='\\'){
      const m=/^\d{1,3}/.exec(lit.slice(i+1));
      if(m){o.push(parseInt(m[0],10)&255);i+=1+m[0].length;continue;}
      const esc={'n':10,'t':9,'r':13,'\\':92,'"':34,"'":39,'0':0}[lit[i+1]];
      if(esc!==undefined){o.push(esc);i+=2;continue;}
      i+=2;continue;
    }
    o.push(lit.charCodeAt(0)&255);i++;
  }
  return Uint8Array.from(o);
}

function toStr(u8) {
  let s = '';
  for (let i = 0; i < u8.length; i++) s += String.fromCharCode(u8[i]);
  return s;
}

function process(src){
  try {
    log(`Target loaded: ${src.length} bytes`);
    
    // 1. Detect Obfuscator
    let isLuraph = src.includes('Luraph') || src.includes('LPH') || src.includes('lph');
    let isIronBrew = src.includes('IronBrew') || src.includes('IB2');
    let isMoonSec = src.includes('MoonSec') || src.includes('MSV');
    
    if(isLuraph) addBadge('Luraph', 'luraph');
    else if(isIronBrew) addBadge('IronBrew', 'ironbrew');
    else if(isMoonSec) addBadge('MoonSec', 'moonsec');
    else addBadge('Unknown/Custom', 'unknown');

    // 2. Extract C Table
    const i = src.indexOf('local C');
    if(i < 0) throw new Error('No "local C" table found. Header cut?');
    let b = src.indexOf('{', i);
    let depth = 0, end = -1;
    for(let j = b; j < src.length; j++){
      const c = src[j];
      if(c === '{') depth++;
      else if(c === '}'){ depth--; if(depth === 0){ end = j; break; } }
      else if(c === '"'){ j++; while(j < src.length){ if(src[j]==='\\') j+=2; else if(src[j]==='"') break; else j++; } }
    }
    if(end < 0) throw new Error('Unbalanced braces in C table');

    const table = src.slice(b+1, end);
    const lits = []; let k = 0;
    while(k < table.length){
      if(table[k] === '"'){
        let j = k+1, buf = '';
        while(j < table.length){
          if(table[j] === '\\'){ buf += table[j] + table[j+1]; j += 2; continue; }
          if(table[j] === '"') break;
          buf += table[j]; j++;
        }
        lits.push(buf); k = j+1;
      } else k++;
    }
    
    log(`Extracted ${lits.length} encrypted strings. Decoding...`);

    let C = lits.map(decEsc);
    let hits = 0, others = 0;
    let outHtml = '';

    const juicy = /https?:\/\/|discord|webhook|HttpGet|loadstring|check|key|white|auth|token|api|\.php|\.json|init|loader|stage/i;

    // 3. Decode
    C.forEach((u8, idx) => {
      // Raw
      let rawStr = toStr(u8);
      // Base64 attempt
      let b64Str = null;
      try {
        let s = rawStr.replace(/-/g, '+').replace(/_/g, '/');
        while(s.length % 4) s += '=';
        b64Str = atob(s);
      } catch(e) {}

      // Check hits
      if (juicy.test(rawStr)) {
        outHtml += `<span class="hit"><span class="label">RAW</span>[${idx}] ${rawStr}</span>`;
        hits++;
      } else if (b64Str && juicy.test(b64Str)) {
        outHtml += `<span class="hit"><span class="label">B64</span>[${idx}] ${b64Str}</span>`;
        hits++;
      } else if (b64Str && b64Str.length > 3) {
        outHtml += `<span class="str"><span class="idx">[${idx}]</span> <span class="blue">${b64Str}</span></span>`;
        others++;
      }
    });

    // Render
    out.innerHTML = outHtml || '<div style="color:#888">No readable strings found. VM emulation required.</div>';
    log(`DONE. ${hits} juicy hits, ${others} decoded strings.`);

  } catch(e) {
    log('CRASH: ' + e.message, true);
  }
}
</script>
</body>
</html>
